name = "clothcycle-api"
main = "src/worker.ts"
compatibility_date = "2026-05-13"

# Cloudflare Pages / Workers deployment configuration
[build]
command = "npm run worker:build"

[env.production]
name = "clothcycle-api"
routes = [
  { pattern = "api.clothcycleph.com/*", zone_id = "replace-with-zone-id" }
]

[env.staging]
name = "clothcycle-api-staging"

[vars]
# Non-secret runtime configuration. Put secrets with `wrangler secret put`.
EMAIL_PROVIDER = "sendgrid"
EMAIL_FROM = "ClothCycle PH <noreply@clothcycleph.com>"
CORS_ORIGIN = "http://localhost:5173,https://clothcycleph.com"
APP_URL = "https://clothcycleph.com"
GOOGLE_CLIENT_ID = ""

# R2 (Object Storage)
R2_BUCKET_NAME = "clothcycle-uploads"
R2_PUBLIC_BASE_URL = "https://api.clothcycleph.com"

# D1 Database - Update database_id after creating database
[[d1_databases]]
binding = "DB"
database_name = "clothcycle"
database_id = "replace-with-d1-database-id"

# R2 Bucket
[[r2_buckets]]
binding = "R2_BUCKET"
bucket_name = "clothcycle-uploads"
jurisdiction = "eu"

# Queues (optional - for async tasks)
# [[queues.producers]]
# binding = "QUEUE"
# 
# [[queues.consumers]]
# queue = "clothcycle-tasks"
# max_batch_size = 10
# max_batch_timeout = 30

# KV Namespace (optional - for caching)
# [[kv_namespaces]]
# binding = "CACHE"
# id = "replace-with-kv-id"
